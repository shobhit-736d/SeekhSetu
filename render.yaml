services:
  # SeekhSetu Frontend - React / Vite Single Page Application (Render Static Site)
  - type: web
    name: seekhsetu-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      # SPA Rewrite: Direct URL access and page refresh (e.g. /profile, /coding) rewritten to index.html with HTTP 200
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://seekhsetu.onrender.com/api

  # SeekhSetu Backend - Express & MongoDB REST API (Render Node.js Web Service)
  - type: web
    name: seekhsetu-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://seekhsetu-h7j4.onrender.com
